name: Enregistrer les votes

# Une issue dont le titre commence par « [vote] » (ouverte depuis le site) est lue,
# validée, puis écrite dans data/votes.json. L'issue reçoit un commentaire et est fermée.

on:
  issues:
    types: [opened, edited]

permissions:
  contents: write
  issues: write

concurrency:
  group: votes
  cancel-in-progress: false

jobs:
  vote:
    if: startsWith(github.event.issue.title, '[vote]')
    runs-on: ubuntu-latest
    env:
      BRANCH: ${{ github.event.repository.default_branch }}
      ISSUE: ${{ github.event.issue.number }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Valider et appliquer le vote
        id: apply
        run: node scripts/apply-vote.mjs

      - name: Commit data/votes.json
        id: commit
        if: steps.apply.outputs.status == 'ok'
        env:
          VOTER: ${{ steps.apply.outputs.voter }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/votes.json
          if git diff --cached --quiet; then
            echo "Aucun changement."
            exit 0
          fi
          git commit -m "Votes de $VOTER (issue #$ISSUE)"
          for attempt in 1 2 3; do
            git push origin "HEAD:$BRANCH" && exit 0
            git pull --rebase origin "$BRANCH"
          done
          exit 1

      - name: Répondre sur l'issue
        if: always() && steps.apply.outputs.status != ''
        env:
          STATUS: ${{ steps.apply.outputs.status }}
          COMMIT: ${{ steps.commit.outcome }}
        run: |
          if [ "$STATUS" = "ok" ] && [ "$COMMIT" != "success" ]; then
            printf '\n\n⚠️ Mais l’écriture dans le dépôt a échoué : réessaie dans quelques minutes.\n' >> "$RUNNER_TEMP/vote-result.md"
          fi
          gh issue comment "$ISSUE" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/vote-result.md"
          if [ "$STATUS" = "ok" ] && [ "$COMMIT" = "success" ]; then
            gh issue close "$ISSUE" --repo "$GITHUB_REPOSITORY" --reason completed
          elif [ "$STATUS" = "error" ]; then
            gh issue close "$ISSUE" --repo "$GITHUB_REPOSITORY" --reason "not planned"
          fi
